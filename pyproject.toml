[project]
name = "mc-icon-service"
version = "1.0.0"
description = "Collects complete Minecraft block and item icons from Mojang and the Minecraft Wiki"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pillow>=10.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
